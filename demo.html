<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Grade Menu Demo</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #1e1e1e;
                color: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
                margin: 0;
            }
            .title-bar {
                -webkit-app-region: drag;
                width: 100%;
                height: 35px;

                display: flex;
                align-items: center;
                padding-left: 15px;
                font-size: 13px;
                font-weight: bold;
                user-select: none;
                flex-shrink: 0;
            }
            .no-drag {
                -webkit-app-region: no-drag;
            }
            .container {
                padding: 24px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                overflow-y: auto;
                flex-grow: 1;
            }
            h2 {
                margin: 0 0 4px 0;
                font-size: 20px;
            }
            p.subtitle {
                margin: 0 0 16px 0;
                color: #aaaaaa;

            }
            .form-group {
                display: flex;

                gap: 6px;
                margin-bottom: 14px;
            }
            label {
                font-size: 12px;
                color: #cccccc;
                font-weight: 500;
            }
            input {
                background-color: #2b2b2b;
                border: 1px solid #444444;
                color: #ffffff;
                padding: 10px 12px;
                border-radius: 6px;
                font-size: 14px;

            }

                border-color: #007acc;
            }
            button {
                background-color: #007acc;
                color: white;
                border: none;
                padding: 10px;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 8px;
                width: 100%;
                transition: background-color 0.2s;
            }
            button:hover {
                background-color: #005999;
            }
            .dropdown-btn { background-color: #007acc; border: 1px solid #444444; color: #ffffff; padding: 10px 12px; border-radius: 6px; font-size: 14px; font-weight: 400; margin: 0; text-align: center; display: flex; justify-content: space-between; align-items: center; }
            .dropdown-btn:hover { background-color: #005a8f; border-color: #666666; }
            .dropdown-btn.placeholder {color: #ffffff; }
            .dropdown-btn.open { border-color: #007acc; }
            .dropdown-panel { background: #2b2b2b; border: 1px solid #444444; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
            .dropdown-panel input { background: #1e1e1e; padding: 8px 10px; font-size: 13px; }
            #district-items { max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; }
            button.district-item { background: transparent; color: #ffffff; text-align: left; margin: 0; padding: 8px; font-size: 13px; font-weight: 500; border-radius: 4px; }
            button.district-item:hover { background: #3a3a3a; }
            button.district-item.other { color: #6cb8ff; border-top: 1px solid #3a3a3a; border-radius: 0; margin-top: 2px; }
            .hidden { display: none !important; }
            .row {display: flex; align-items: center; justify-content: space-between; gap: 10px; }
            button.small { width: auto; margin: 0; padding: 6px 12px; font-size: 12px; }
            #course-list { display: flex; flex-direction: column; gap: 10px; }
            .card { background: #2b2b2b;border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
            .card:hover {background: #343434; }
            .card .name {font-size: 14px; font-weight: 600; }
            .card .code { font-size: 12px; color: #aaaaaa; margin-top: 2px; }
            .badge { min-width: 64px; text-align: center; padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: 15px; color: #111111; }
            .g-a { background: #5fd97a } .g-b { background: #6cb8ff; } .g-c { background: #f0c05a; }
            .g-d { background: #f08a5a; } .g-f { background: #e5646a; } .g-none { background: #444444; color: #cccccc; }
            .selection-title { font-size: 12px; color: #aaaaaa; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 2px; }
            .line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #333333; font-size: 13px; }
            .line .meta { font-size: 11px; color: #aaaaaa; margin-top: 2px; }
            .line .score { text-align: right; white-space: nowrap; font-weight: 600; }
            .empty { color: #aaaaaa; font-size: 13px; }
            .summary { display: flex; gap: 10px; margin: 12px 0; }
            .summary .box { flex: 1; background: #2b2b2b; border-radius: 8px; padding: 8px 10px; }
            .summary .label { font-size: 11px; color: #aaaaaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
            .delta { font-size: 12px; margin-top: 6px; text-align: center; color: #aaaaaa; }
            .delta.up { color: #5fd97a; }
            .delta.down { color: #e5646a; }
            .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
            button.small.secondary { background: #3a3a3a; }
            button.small.secondary:hover { background: #4a4a4a; }
            .note { font-size: 11px; color: #888888; margin: 4px 0 0; }
            .wi-score { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-weight: 600; }
            .wi-input { width: 64px; padding: 4px 6px; font-size: 13px; text-align: right; }
            .wi-input.changed { border-color: #f0c05a; }
            .wi-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }
            .wi-name { padding: 4px 6px; font-size: 13px; }
            .wi-select { background-color: #2b2b2b; border: 1px solid #444444; color: #ffffff; border-radius: 6px; padding: 4px 6px; font-size: 12px; }
            button.wi-remove, button.wi-remove:hover { background: transparent; color: #e5646a; width: auto; margin: 0; padding: 0 6px; font-size: 18px; }
            .score.changed-text { text-decoration: underline dotted; }
            .text-a { color: #5fd97a; }
            .text-b { color: #6cb8ff; }
            .text-c { color: #f08a5a; }
            .text-f { color: #e5646a; }
            .wi-input::-webkit-outer-spin-button, .wi-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
            .wi-input { appearance: textfield; }
            ::-webkit-scrollbar { width: 8px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #444444; border-radius: 4px; }
            ::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
            .cat-group { border-bottom: 1px solid #333333; }
            .cat-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; cursor: pointer; user-select: none; font-size: 13px; }
            .cat-header:hover { background: #262626; }
            .cat-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
            .cat-chevron { display: inline-block; width: 12px; color: #aaaaaa; }
            .cat-name { font-weight: 600; }
            .cat-weight { color: #aaaaaa; font-size: 12px; }
            .cat-right { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
            .cat-points { color: #aaaaaa; font-size: 12px; }
            .cat-pct { font-weight: 700; min-width: 52px; text-align: right; }
            .cat-body { padding-left: 20px; }
            .cat-body .line:last-child { border-bottom: none; }


        
            html { background: #0f0f0f; }
            body { align-items: center; justify-content: center; background: #0f0f0f; }
            .app { width: min(420px, 100%); height: min(640px, 100vh); background: #1e1e1e; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid #333333; }
            .title-bar { -webkit-app-region: no-drag; }
            .container { min-height: 0; }
            .banner { margin: 0; padding: 8px 10px; background: #2b2b2b; border-radius: 8px; font-size: 12px; color: #aaaaaa; }
        </style>
    </head>
    <body>
        <div class="app">
            <div class="title-bar">Grade Menu &middot; Demo</div>
            <div class="container" id="courses-screen">
                <div class="row"><h2>Grades</h2></div>
                <p class="banner">Demo with made-up sample data. Open a class, then tap Edit grades to try what-ifs.</p>
                <p id="courses-status" class="empty"></p>
                <div id="course-list"></div>
            </div>
            <div class="container hidden" id="detail-screen">
                <div><button class="small" id="back-btn">&larr; Back</button></div>
                <div id="detail-content"></div>
            </div>
        </div>
        <script>
            const detailContent = document.getElementById('detail-content');
            const courseList = document.getElementById('course-list');
            const coursesStatus = document.getElementById('courses-status');

            function showScreen(screenId) {
                document.querySelectorAll('.container').forEach((screen) => {
                    screen.classList.toggle('hidden', screen.id !== screenId);
                });
            }

            function addText(parent, tagName, className, text) {
                const element = document.createElement(tagName);
                element.className = className;
                element.textContent = text;
                parent.appendChild(element);
                return element;
            }

            function gradeClass(average) {
                if (!Number.isFinite(average)) return 'g-none';
                if (average >= 90) return 'g-a';
                if (average >= 80) return 'g-b';
                if (average >= 70) return 'g-d';
                return 'g-f';
            }

            function percentClass(pct) {
                if (!Number.isFinite(pct)) return '';
                if (pct >= 90) return 'text-a';
                if (pct >= 80) return 'text-b';
                if (pct >= 70) return 'text-c';
                return 'text-f';
            }

            function averageLabel(average) {
                return Number.isFinite(average) ? `${average.toFixed(1)}%` : 'N/A';
            }

            function renderCourses(classes) {
                courseList.replaceChildren();
                classes.forEach((course) => {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'card';

                    const courseInfo = document.createElement('div');
                    addText(courseInfo, 'div', 'name', course.title || course.fullName || 'Unnamed course');
                    if (course.code) addText(courseInfo, 'div', 'code', course.code);
                    card.appendChild(courseInfo);

                    addText(card, 'span', `badge ${gradeClass(course.average)}`, averageLabel(course.average));
                    card.addEventListener('click', () => renderCourseDetails(course));
                    courseList.appendChild(card);
                });
                coursesStatus.textContent = classes.length
                    ? `Loaded ${classes.length} classes.`
                    : 'No classes were found on the HAC assignments page.';
            }

            // ---------- What-if helpers ----------
            const norm = (s) => String(s || '').trim().toLowerCase();
            const fmtNum = (n) => String(Math.round(n * 100) / 100);

            function parseScore(a) {
                const m = String(a.scoreText || '').match(/^\s*(-?[\d.]+)\s*\/\s*([\d.]+)/);
                if (m) {
                    const e = parseFloat(m[1]);
                    const p = parseFloat(m[2]);
                    if (!Number.isNaN(e) && !Number.isNaN(p)) return { earned: e, possible: p };
                }
                return {
                    earned: Number.isFinite(a.earned) ? a.earned : null,
                    possible: Number.isFinite(a.possible) ? a.possible : null,
                };
            }

            function calcGrade(categories, items) {
                const byCat = new Map();
                items.forEach((it) => {
                    if (!Number.isFinite(it.earned) || !Number.isFinite(it.possible)) return;
                    const key = norm(it.category);
                    const c = byCat.get(key) || { earned: 0, possible: 0 };
                    c.earned += it.earned;
                    c.possible += it.possible;
                    byCat.set(key, c);
                });

                const catResults = new Map();
                byCat.forEach((v, key) => catResults.set(key, v.possible > 0 ? (v.earned / v.possible) * 100 : null));

                const weights = new Map(categories.map((c) => [norm(c.name), c.weight]));
                const hasWeights = categories.some((c) => Number.isFinite(c.weight) && c.weight > 0);

                let total = null;
                if (hasWeights) {
                    let weightSum = 0;
                    let scoreSum = 0;
                    catResults.forEach((pct, key) => {
                        const wt = weights.get(key);
                        if (pct === null || !Number.isFinite(wt)) return;
                        weightSum += wt;
                        scoreSum += pct * wt;
                    });
                    total = weightSum > 0 ? scoreSum / weightSum : null;
                } else {
                    let e = 0;
                    let p = 0;
                    byCat.forEach((v) => { e += v.earned; p += v.possible; });
                    total = p > 0 ? (e / p) * 100 : null;
                }
                return { total, catResults, byCat };
            }

            function makeNumberInput(value, placeholder) {
                const input = document.createElement('input');
                input.type = 'number';
                input.min = '0';
                input.step = 'any';
                input.className = 'wi-input';
                input.placeholder = placeholder;
                input.value = value === null ? '' : String(value);
                return input;
            }

            function readNumber(input) {
                const n = parseFloat(input.value);
                return Number.isNaN(n) ? null : n;
            }

            function renderCourseDetails(course) {
                const categories = course.categories || [];
                const state = {
                    editing: false,
                    open: new Set(),
                    lastKey: '',
                    focusItem: null,
                    items: (course.assignments || []).map((a) => {
                        const { earned, possible } = parseScore(a);
                        return {
                            name: a.name || 'Assignment',
                            category: a.category || '',
                            dueDate: a.dueDate || '',
                            scoreText: a.scoreText || '',
                            earned,
                            possible,
                            original: earned,
                            added: false,
                        };
                    }),
                };
                const categoryNames = categories.length
                    ? categories.map((c) => c.name)
                    : [...new Set(state.items.map((i) => i.category).filter(Boolean))];
                const baseline = calcGrade(categories, state.items).total;
                let ui = {};

                const isChanged = (item) => item.added || item.earned !== item.original;
                const isDirty = () => state.items.some(isChanged);

                function getGroups() {
                    const groups = categories.map((c) => ({ key: norm(c.name), name: c.name || 'Category', category: c }));
                    const known = new Set(groups.map((g) => g.key));
                    state.items.forEach((it) => {
                        const key = norm(it.category);
                        if (!known.has(key)) {
                            known.add(key);
                            groups.push({ key, name: it.category || 'Uncategorized', category: null });
                        }
                    });
                    return groups;
                }

                function update() {
                    const result = calcGrade(categories, state.items);
                    const dirty = isDirty();

                    if (ui.whatIfBadge) {
                        ui.whatIfBadge.className = `badge ${gradeClass(result.total)}`;
                        ui.whatIfBadge.textContent = averageLabel(result.total);
                        const diff = Number.isFinite(result.total) && Number.isFinite(baseline)
                            ? result.total - baseline
                            : null;
                        const changed = diff !== null && Math.abs(diff) >= 0.05;
                        ui.delta.textContent = changed
                            ? `${diff > 0 ? '+' : ''}${diff.toFixed(1)}% vs current`
                            : 'No change';
                        ui.delta.className = 'delta' + (changed ? (diff > 0 ? ' up' : ' down') : '');
                    }

                    ui.groups.forEach(({ key, category, percentEl, pointsEl }) => {
                        const computed = result.catResults.get(key);
                        const hacPercent = category ? category.percent : null;
                        const value = dirty || !Number.isFinite(hacPercent) ? computed : hacPercent;
                        percentEl.textContent = Number.isFinite(value) ? `${fmtNum(value)}%` : 'N/A';
                        percentEl.className = 'cat-pct ' + percentClass(value);
                        const pts = result.byCat.get(key);
                        pointsEl.textContent = pts && pts.possible > 0 ? `${fmtNum(pts.earned)} / ${fmtNum(pts.possible)}` : '';
                    });

                    if (ui.note) {
                        const mismatch = Number.isFinite(baseline) && Number.isFinite(course.average)
                            && Math.abs(baseline - course.average) > 0.15;
                        ui.note.textContent = 'Estimate only. Your teacher may round, drop scores, or weight things differently.'
                            + (mismatch
                                ? ` My calculation of your current grade (${baseline.toFixed(1)}%) differs from HAC's (${course.average.toFixed(1)}%), so treat the result as approximate.`
                                : '');
                    }
                }

                function buildRow(item) {
                    const line = document.createElement('div');
                    line.className = 'line';
                    const info = document.createElement('div');
                    const score = document.createElement('div');

                    if (state.editing) {
                        if (item.added) {
                            info.className = 'wi-info';
                            const nameInput = document.createElement('input');
                            nameInput.type = 'text';
                            nameInput.className = 'wi-name';
                            nameInput.value = item.name;
                            nameInput.addEventListener('input', () => { item.name = nameInput.value; });
                            info.appendChild(nameInput);

                            const select = document.createElement('select');
                            select.className = 'wi-select';
                            categoryNames.forEach((n) => select.appendChild(new Option(n, n)));
                            select.value = item.category;
                            select.addEventListener('change', () => {
                                item.category = select.value;
                                state.open.add(norm(item.category));
                                state.lastKey = norm(item.category);
                                state.focusItem = item;
                                draw();
                            });
                            info.appendChild(select);
                        } else {
                            addText(info, 'div', '', item.name);
                            const metadata = [item.category, item.dueDate].filter(Boolean).join(' | ');
                            if (metadata) addText(info, 'div', 'meta', metadata);
                        }

                        score.className = 'wi-score';
                        const earnedInput = makeNumberInput(item.earned, 'Score');
                        earnedInput.classList.toggle('changed', isChanged(item));
                        earnedInput.addEventListener('input', () => {
                            item.earned = readNumber(earnedInput);
                            earnedInput.classList.toggle('changed', isChanged(item));
                            update();
                        });
                        if (item === state.focusItem) ui.focusEl = earnedInput;
                        score.appendChild(earnedInput);
                        addText(score, 'span', '', '/');

                        if (item.added) {
                            const possibleInput = makeNumberInput(item.possible, 'Total');
                            possibleInput.addEventListener('input', () => {
                                item.possible = readNumber(possibleInput);
                                update();
                            });
                            score.appendChild(possibleInput);
                            const remove = addText(score, 'button', 'wi-remove', '\u00d7');
                            remove.type = 'button';
                            remove.title = 'Remove';
                            remove.addEventListener('click', () => {
                                state.items = state.items.filter((i) => i !== item);
                                draw();
                            });
                        } else {
                            addText(score, 'span', '', item.possible === null ? '\u2014' : String(item.possible));
                        }
                    } else {
                        addText(info, 'div', '', item.name);
                        const metadata = [item.added ? 'What-if' : '', item.category, item.dueDate]
                            .filter(Boolean).join(' | ');
                        if (metadata) addText(info, 'div', 'meta', metadata);

                        let text;
                        if (isChanged(item)) {
                            text = `${item.earned === null ? 'N/A' : item.earned} / ${item.possible === null ? '\u2014' : item.possible}`;
                        } else {
                            const base = item.scoreText || (Number.isFinite(item.earned) ? String(item.earned) : 'N/A');
                            const hasPointRatio = /\/\s*[\d.]+/.test(base);
                            const points = Number.isFinite(item.possible) && !hasPointRatio ? ` / ${item.possible}` : '';
                            text = `${base}${points}`;
                        }
                        const itemPct = Number.isFinite(item.earned) && item.possible > 0
                            ? (item.earned / item.possible) * 100
                            : null;
                        score.className = 'score ' + percentClass(itemPct) + (isChanged(item) ? ' changed-text' : '');
                        score.textContent = text;
                    }

                    line.appendChild(info);
                    line.appendChild(score);
                    return line;
                }

                function draw() {
                    const scroller = detailContent.closest('.container');
                    const prevTop = scroller ? scroller.scrollTop : 0;
                    detailContent.replaceChildren();
                    ui = { groups: [] };

                    const heading = document.createElement('div');
                    addText(heading, 'h2', '', course.title || course.fullName || 'Course details');
                    if (course.code) addText(heading, 'p', 'subtitle', course.code);
                    detailContent.appendChild(heading);

                    const summary = document.createElement('div');
                    summary.className = 'summary';
                    const currentBox = addText(summary, 'div', 'box', '');
                    addText(currentBox, 'div', 'label', 'Current');
                    addText(currentBox, 'div', `badge ${gradeClass(course.average)}`, averageLabel(course.average));
                    if (state.editing || isDirty()) {
                        const box = addText(summary, 'div', 'box', '');
                        addText(box, 'div', 'label', 'What-if');
                        ui.whatIfBadge = addText(box, 'div', 'badge', '');
                        ui.delta = addText(box, 'div', 'delta', '');
                    }
                    detailContent.appendChild(summary);

                    const tools = document.createElement('div');
                    tools.className = 'tools';
                    const editBtn = addText(tools, 'button', 'small', state.editing ? 'Done' : 'Edit grades');
                    editBtn.type = 'button';
                    editBtn.addEventListener('click', () => { state.editing = !state.editing; draw(); });
                    if (state.editing) {
                        const addBtn = addText(tools, 'button', 'small secondary', '+ Add assignment');
                        addBtn.type = 'button';
                        addBtn.addEventListener('click', () => {
                            const category = categoryNames.find((n) => norm(n) === state.lastKey) || categoryNames[0] || '';
                            const item = {
                                name: 'New assignment',
                                category,
                                dueDate: '',
                                scoreText: '',
                                earned: null,
                                possible: 100,
                                original: null,
                                added: true,
                            };
                            state.items.unshift(item);
                            state.open.add(norm(category));
                            state.lastKey = norm(category);
                            state.focusItem = item;
                            draw();
                        });
                        const resetBtn = addText(tools, 'button', 'small secondary', 'Reset');
                        resetBtn.type = 'button';
                        resetBtn.addEventListener('click', () => {
                            state.items = state.items.filter((i) => !i.added);
                            state.items.forEach((i) => { i.earned = i.original; });
                            draw();
                        });
                    }
                    detailContent.appendChild(tools);
                    if (state.editing || isDirty()) ui.note = addText(detailContent, 'p', 'note', '');

                    addText(detailContent, 'h3', 'selection-title', 'Categories');
                    const groups = getGroups();
                    if (!groups.length) {
                        addText(detailContent, 'p', 'empty', 'No categories or assignments found for this class.');
                    }
                    groups.forEach((g) => {
                        const wrap = document.createElement('div');
                        wrap.className = 'cat-group';

                        const header = document.createElement('div');
                        header.className = 'cat-header';
                        const left = addText(header, 'div', 'cat-left', '');
                        const chevron = addText(left, 'span', 'cat-chevron', state.open.has(g.key) ? '\u25be' : '\u25b8');
                        addText(left, 'span', 'cat-name', g.name);
                        if (g.category && Number.isFinite(g.category.weight)) {
                            addText(left, 'span', 'cat-weight', `(${g.category.weight}%)`);
                        }
                        const right = addText(header, 'div', 'cat-right', '');
                        const pointsEl = addText(right, 'span', 'cat-points', '');
                        const percentEl = addText(right, 'span', 'cat-pct', '');
                        wrap.appendChild(header);

                        const body = document.createElement('div');
                        body.className = 'cat-body' + (state.open.has(g.key) ? '' : ' hidden');
                        const groupItems = state.items.filter((it) => norm(it.category) === g.key);
                        if (groupItems.length) {
                            groupItems.forEach((item) => body.appendChild(buildRow(item)));
                        } else {
                            addText(body, 'p', 'empty', 'No assignments in this category.');
                        }
                        wrap.appendChild(body);

                        header.addEventListener('click', () => {
                            const open = !state.open.has(g.key);
                            if (open) {
                                state.open.add(g.key);
                                state.lastKey = g.key;
                            } else {
                                state.open.delete(g.key);
                            }
                            body.classList.toggle('hidden', !open);
                            chevron.textContent = open ? '\u25be' : '\u25b8';
                        });

                        ui.groups.push({ key: g.key, category: g.category, percentEl, pointsEl });
                        detailContent.appendChild(wrap);
                    });

                    update();
                    showScreen('detail-screen');
                    if (scroller) scroller.scrollTop = prevTop;
                    if (ui.focusEl) {
                        ui.focusEl.focus();
                        ui.focusEl.scrollIntoView({ block: 'nearest' });
                        state.focusItem = null;
                    }
                }

                draw();
            }


            const a = (name, category, dueDate, earned, possible) => ({
                name, category, dueDate, earned, possible,
                scoreText: earned === null ? '' : earned.toFixed(2),
            });
            const cats = (m, n, o) => [
                { name: 'Major Grades', weight: m },
                { name: 'Minor Grades', weight: n },
                { name: 'Other Grades', weight: o },
            ];

            const DEMO = [
                {
                    title: 'Algebra II', code: '2041 - 1', categories: cats(50, 35, 15),
                    assignments: [
                        a('Unit 4 Test', 'Major Grades', '11/18/2026', null, 100),
                        a('Unit 3 Test', 'Major Grades', '10/21/2026', 88, 100),
                        a('Unit 2 Test', 'Major Grades', '09/30/2026', 94, 100),
                        a('Systems Quiz', 'Minor Grades', '10/16/2026', 46, 50),
                        a('Graphing Quiz', 'Minor Grades', '10/09/2026', 40, 50),
                        a('Homework 3.3', 'Other Grades', '10/20/2026', 20, 20),
                        a('Homework 3.2', 'Other Grades', '10/14/2026', 18, 20),
                    ],
                },
                {
                    title: 'Biology', code: '3110 - 2', categories: cats(40, 40, 20),
                    assignments: [
                        a('Cell Unit Exam', 'Major Grades', '10/22/2026', 71, 100),
                        a('Genetics Project', 'Major Grades', '11/12/2026', null, 100),
                        a('Lab: Osmosis', 'Minor Grades', '10/08/2026', 34, 40),
                        a('Vocab Quiz #2', 'Minor Grades', '10/15/2026', 14, 20),
                        a('Lab: Microscopes', 'Minor Grades', '09/24/2026', 36, 40),
                        a('Reading Notes', 'Other Grades', '10/19/2026', 9, 10),
                        a('Extra Credit', 'Other Grades', '12/18/2026', null, 5),
                    ],
                },
                {
                    title: 'World History', code: '4120 - 3', categories: cats(50, 30, 20),
                    assignments: [
                        a('Unit 2 Essay', 'Major Grades', '10/27/2026', 62, 100),
                        a('Midterm Exam', 'Major Grades', '11/20/2026', null, 100),
                        a('Map Quiz', 'Minor Grades', '10/12/2026', 21, 25),
                        a('Document Analysis', 'Minor Grades', '10/26/2026', 17, 25),
                        a('Class Participation', 'Other Grades', '10/30/2026', 45, 50),
                    ],
                },
            ];

            DEMO.forEach((course) => {
                const result = calcGrade(course.categories, course.assignments);
                course.average = result.total;
                course.categories.forEach((c) => { c.percent = result.catResults.get(norm(c.name)); });
            });

            renderCourses(DEMO);
            document.getElementById('back-btn').addEventListener('click', () => showScreen('courses-screen'));
        </script>
    </body>
</html>
