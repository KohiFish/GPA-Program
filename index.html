<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Grade Menu App</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #1e1e1e;
                color: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
                margin: 0;
            }
            .title-bar {
                -webkit-app-region: drag;
                width: 100%;
                height: 35px;
                background-color: #2d2d2d;
                display: flex;
                align-items: center;
                padding-left: 15px;
                font-size: 13px;
                font-weight: bold;
                user-select: none;
                flex-shrink: 0;
            }
            .no-drag {
                -webkit-app-region: no-drag;
            }
            .container {
                padding: 24px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                overflow-y: auto;
                flex-grow: 1;
            }
            h2 {
                margin: 0 0 4px 0;
                font-size: 20px;
            }
            p.subtitle {
                margin: 0 0 16px 0;
                color: #aaaaaa;
                font-size: 13px;
            }
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 14px;
            }
            label {
                font-size: 12px;
                color: #cccccc;
                font-weight: 500;
            }
            input {
                background-color: #2b2b2b;
                border: 1px solid #444444;
                color: #ffffff;
                padding: 10px 12px;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                width: 100%;
                transition: border-color 0.2s;
            }
            input:focus {
                border-color: #007acc;
            }
            button {
                background-color: #007acc;
                color: white;
                border: none;
                padding: 10px;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 8px;
                width: 100%;
                transition: background-color 0.2s;
            }
            button:hover {
                background-color: #005999;
            }
            
        </style>
    </head>
    <body>
        <div class="title-bar">Grade Menu</div>
        <div class="container" id="login-screen">
            <div>
                <h2>Home Access Center</h2>
                <p class="subtitle">Enter your district portal information</p>
            </div>
            <form id="hac-login-form">
                <div class="form-group">
                    <label for="district-url">District HAC URL</label>
                    <input type="url" id="district-url" placeholder="Your school's URL" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Student ID" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit">Connect and view grades</button>
                <p id="connection-status" role="status" aria-live="polite"></p>
            </form>
        </div>
        <script>
            document.getElementById('hac-login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                document.getElementById('connection-status').textContent =
                    'HAC sign-in is not implemented yet. Your credentials were not saved or sent.';
            });
        </script>
    </body>
</html>
